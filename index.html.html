<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(#06b6d4);
      padding: 20px;
    }

    .form-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .form-card h2 {
      text-align: center;
      color: #1f2937;
      margin-bottom: 6px;
    }

    .form-card p.subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: #f9fafb;
      color: #111827;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #4f46e5;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    select {
      cursor: pointer;
    }

    /* Hidden "other" box with smooth reveal */
    .hidden {
      display: none;
    }

    #otherGenderBox {
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: #4f46e5;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #4338ca;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Create Account</h2>
    <p class="subtitle">Please fill in your details below</p>

    <form action="process.php" method="POST">

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">-- Select gender --</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group hidden" id="otherGenderBox">
        <label for="otherGender">Please specify other gender</label>
        <input type="text" id="otherGender" name="otherGender" placeholder="Specify your gender">
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    const genderSelect = document.getElementById('gender');
    const otherBox = document.getElementById('otherGenderBox');
    const otherInput = document.getElementById('otherGender');

    genderSelect.addEventListener('change', () => {
      if (genderSelect.value === 'other') {
        otherBox.classList.remove('hidden');
        otherInput.required = true;
        otherInput.focus();
      } else {
        otherBox.classList.add('hidden');
        otherInput.required = false;
        otherInput.value = '';
      }
    });
  </script>

</body>
</html>
